<style>

    --a-eat:#b08a2e; --a-sleep:#1c1f17; --a-social:#6f8a44; --a-wander:#a9a493;

    --a-eat:#e0b84a; --a-sleep:#f1eede; --a-social:#9fc070; --a-wander:#77735f;
    --tile-well:#2c4a52; --tile-bath:#4a3542; --tile-park:#3a5228; --a-drink:#6fc0cf; --a-wash:#d79ab8; --a-play:#e8855f; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg:#15170f; --ink:#e9e6d6; --mid:#a19c80; --line:#3a3c2e;

    --a-eat:#e0b84a; --a-sleep:#f1eede; --a-social:#9fc070; --a-wander:#77735f;

<main>
  <canvas id="glcv"></canvas>
  <canvas id="cv" hidden></canvas>

  <div class="row" id="viewRow"></div>
  <div class="row" id="tools"></div>

  <div class="row">
    <span>agents <b id="nLabel">1000</b></span>

  </div>

  <div class="panels">
    <div class="panel"><h2>Cost per frame (ms, smoothed)</h2><table id="perf"></table></div>
    <div class="panel"><h2>Needs and actions</h2><table id="pop"></table></div>

    <div class="panel" style="grid-column:1/-1">
      <h2>Benchmark (ms per frame; live fps is the current view)</h2>
      <button id="benchBtn">run benchmark</button>
      <table id="benchOut" style="margin-top:6px"></table>
    </div>
    <div class="panel" style="grid-column:1/-1"><h2>Action matrix by agent type (rebuilt every 8 ticks)</h2><div class="row" id="typeBtns" style="margin-top:0"></div><table id="mat"></table></div>
  </div>
</main>

<script>
'use strict';
// ───────────────────────── constants ─────────────────────────
const W = 96, H = 64, CS = 8, CELLS = W * H, N_MAX = 20000;
const EMPTY = 0, WALL = 1, INF = 65535;

// One row per need. Each need has one action and one building that satisfies it.
// Adding a need = one row here + two colour tokens (--tile-<building>, --a-<action>) in the CSS.
const NEEDS = [
  { name: 'hunger',  action: 'eat',    building: 'food',  grow: 0.0008, recover: 0.010, weight: 1.2 },
  { name: 'fatigue', action: 'sleep',  building: 'bed',   grow: 0.0005, recover: 0.006, weight: 1.2 },
  { name: 'lonely',  action: 'social', building: 'plaza', grow: 0.0006, recover: 0.008, weight: 1.0 },
  { name: 'thirst',  action: 'drink',  building: 'well',  grow: 0.0011, recover: 0.020, weight: 1.3 },
  { name: 'dirty',   action: 'wash',   building: 'bath',  grow: 0.0003, recover: 0.008, weight: 0.9 },
  { name: 'bored',   action: 'play',   building: 'park',  grow: 0.0007, recover: 0.007, weight: 0.9 },
];
// One row per agent type. Each type gets its own action matrix.
//   grow   = how much faster a need builds up for this type
//   weight = how much more this type cares about a need when choosing what to do
const TYPES = [
  { name: 'adult', share: 3, speed: 1.00, grow: {}, weight: {} },
  { name: 'child', share: 1, speed: 1.25, grow: { fatigue: 1.4, bored: 1.6 }, weight: { bored: 1.5, dirty: 0.5 } },
  { name: 'elder', share: 1, speed: 0.65, grow: { fatigue: 1.3, bored: 0.6 }, weight: { fatigue: 1.3, lonely: 1.4 } },
];
const K = NEEDS.length, T = TYPES.length;
const A = K + 1, A_WANDER = K;                 // one action per need, plus wander
const F = 2 * K + 1, F_BIAS = 2 * K;           // features: need², distance to its building, bias
const MA = F * A;                              // size of one type's matrix
const tileOf = k => 2 + k;                     // tile id of need k's building
const ACTION_NAMES = [...NEEDS.map(n => n.action), 'wander'];
const FEATURE_NAMES = [...NEEDS.map(n => n.name + '²'), ...NEEDS.map(n => 'dist ' + n.building), 'bias'];
const ACTION_VARS = ACTION_NAMES.map(n => '--a-' + n);
const TILE_VARS = ['--tile-empty', '--tile-wall', ...NEEDS.map(n => '--tile-' + n.building)];
const ACTION_COLORS = [], TILE_COLORS = [], PAL = {};
function loadPalette() {   // canvas colours follow the page theme
  const cs = getComputedStyle(document.documentElement);
  ACTION_VARS.forEach((v, i) => ACTION_COLORS[i] = cs.getPropertyValue(v).trim());
  TILE_VARS.forEach((v, i) => TILE_COLORS[i] = cs.getPropertyValue(v).trim());
  for (const [k, v] of [['bg', '--bg'], ['ink', '--ink'], ['mid', '--mid'], ['floor2', '--tile-empty2'], ['wallL', '--wall-l'], ['wallR', '--wall-r']])
    PAL[k] = cs.getPropertyValue(v).trim();
}
loadPalette();

const SLOTS_PER_TILE = 3;          // soft capacity of one building tile
const SPEED = 0.18;                // cells per tick for a type with speed 1
const STICKY = 0.10;               // bonus for keeping the current action
const DIST_WEIGHT = -0.25, WANDER_BIAS = 0.12;
const PACE = 0.4;                  // global tuning knob: how fast all needs build up (1 = agents cannot keep up on this map)
const TRAIT_SPREAD = 0.3;         // individual variation: each need grows ±30% faster or slower per agent
const DECIDE_EVERY = 16;           // each agent re-decides every 16 ticks (staggered)
const MATRIX_EVERY = 8;

// ───────────────────────── world ─────────────────────────
const tiles = new Uint8Array(CELLS);
const dist = NEEDS.map(() => new Uint16Array(CELLS));   // one distance field per need's building
const tileCount = new Int32Array(K);
const queue = new Int32Array(CELLS);

function rect(x0, y0, w, h, t) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) tiles[y * W + x] = t;
}
function buildMap() {
  const b = name => tileOf(NEEDS.findIndex(n => n.building === name));
  tiles.fill(EMPTY);
  rect(0, 0, W, 1, WALL); rect(0, H - 1, W, 1, WALL); rect(0, 0, 1, H, WALL); rect(W - 1, 0, 1, H, WALL);
  rect(30, 8, 1, 30, WALL); rect(60, 26, 1, 30, WALL); rect(30, 44, 20, 1, WALL); rect(44, 16, 30, 1, WALL);
  rect(8, 8, 4, 4, b('food'));   rect(80, 50, 4, 4, b('food'));
  rect(76, 6, 8, 3, b('bed'));   rect(8, 52, 8, 2, b('bed'));
  rect(42, 28, 6, 6, b('plaza'));
  rect(50, 6, 3, 3, b('well'));  rect(20, 30, 3, 3, b('well'));
  rect(70, 34, 5, 3, b('bath'));
  rect(10, 22, 6, 6, b('park')); rect(66, 44, 6, 6, b('park'));
}

// One distance field per destination type, shared by every agent.
// Steps cost 2 straight and 3 diagonal, so distances approximate real walking distance in any direction.
// Diagonal steps may not cut a wall corner. Cells are re-queued whenever a shorter route to them is found.
const inQueue = new Uint8Array(CELLS);
const STEP = [-1, 2, 1, 2, -W, 2, W, 2, -W - 1, 3, -W + 1, 3, W - 1, 3, W + 1, 3];
function buildField(k) {
  const d = dist[k], tileType = tileOf(k);
  d.fill(INF);
  let head = 0, tail = 0, size = 0, count = 0;
  for (let c = 0; c < CELLS; c++) if (tiles[c] === tileType) { d[c] = 0; queue[tail++] = c; inQueue[c] = 1; size++; count++; }
  tail %= CELLS;
  tileCount[k] = count;
  while (size > 0) {
    const c = queue[head]; head = (head + 1) % CELLS; size--; inQueue[c] = 0;
    const here = d[c];
    for (let s = 0; s < 16; s += 2) {
      const off = STEP[s], nc = c + off;
      if (tiles[nc] === WALL) continue;
      if (s >= 8) {                                // diagonal: both straight neighbours must be open
        const ox = off < 0 ? (off === -W - 1 ? -1 : 1) : (off === W - 1 ? -1 : 1), oy = off < 0 ? -W : W;
        if (tiles[c + ox] === WALL || tiles[c + oy] === WALL) continue;
      }
      const nd = here + STEP[s + 1];
      if (nd < d[nc]) {
        d[nc] = nd;
        if (!inQueue[nc]) { inQueue[nc] = 1; queue[tail] = nc; tail = (tail + 1) % CELLS; size++; }
      }
    }
  }
}
function buildFields() { for (let k = 0; k < K; k++) buildField(k); }

// ───────────────────────── agents (struct of arrays) ─────────────────────────
let N = 1000;
const px = new Float32Array(N_MAX), py = new Float32Array(N_MAX);   // position in cells
const tc = new Int32Array(N_MAX);                                    // target cell index
const needs = new Float32Array(N_MAX * K);                           // 0 = satisfied, 1 = desperate
const rate = new Float32Array(N_MAX * K);                            // traits: this agent's growth per tick, per need
const agentSpeed = new Float32Array(N_MAX);                          // trait: cells per tick
const type = new Uint8Array(N_MAX);                                  // which matrix this agent uses
const action = new Uint8Array(N_MAX);
const using = new Uint8Array(N_MAX);
const users = new Int32Array(K);                                     // agents currently using each building type

let seed = 12345;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

const TYPE_PICK = [];
TYPES.forEach((t, k) => { for (let n = 0; n < t.share; n++) TYPE_PICK.push(k); });

function spawn(i) {
  let c;
  do { c = (rnd() * CELLS) | 0; } while (tiles[c] === WALL);
  tc[i] = c; px[i] = (c % W) + 0.5; py[i] = ((c / W) | 0) + 0.5;
  const t = TYPE_PICK[i % TYPE_PICK.length], ty = TYPES[t];
  type[i] = t;
  agentSpeed[i] = SPEED * ty.speed * (0.9 + rnd() * 0.2);
  for (let k = 0; k < K; k++) {
    needs[i * K + k] = rnd() * 0.7;
    rate[i * K + k] = PACE * NEEDS[k].grow * (ty.grow[NEEDS[k].name] || 1) * (1 + (rnd() * 2 - 1) * TRAIT_SPREAD);
  }
  action[i] = A_WANDER; using[i] = 0;
  vx[i] = vy[i] = 0; settle[i] = 0;
}

// ───────────────────────── the action matrices ─────────────────────────
// scores[agent][action] = Σ_f features[agent][f] * M[type of agent][f][action]
// BASE holds each type's design values; M is BASE adjusted for the current state of the world.
const BASE = new Float32Array(T * MA), M = new Float32Array(T * MA);
const RECOVER = Float32Array.from(NEEDS, n => n.recover);
const saturation = new Float32Array(K);
for (let t = 0; t < T; t++) {
  for (let k = 0; k < K; k++) {
    BASE[t * MA + k * A + k] = NEEDS[k].weight * (TYPES[t].weight[NEEDS[k].name] || 1);   // need² → its action
    BASE[t * MA + (K + k) * A + k] = DIST_WEIGHT;                                          // far building → less appeal
  }
  BASE[t * MA + F_BIAS * A + A_WANDER] = WANDER_BIAS;
}

// World state → matrices. Crowded buildings lower their own pull (a price signal),
// which is what stops a thousand agents from all choosing the same thing.
function rebuildMatrix() {
  M.set(BASE);
  for (let k = 0; k < K; k++) {
    const cap = tileCount[k] * SLOTS_PER_TILE;
    const sat = cap > 0 ? Math.min(1, users[k] / cap) : 1;
    saturation[k] = sat;
    for (let t = 0; t < T; t++) M[t * MA + k * A + k] *= 1 - 0.6 * sat;
  }
}

const feat = new Float32Array(F);
function decide(i) {
  const c = tc[i], n = i * K, m = type[i] * MA;
  for (let k = 0; k < K; k++) {
    const v = needs[n + k], d = dist[k][c];
    feat[k] = v * v;
    feat[K + k] = d === INF ? 8 : Math.min(1, d / 256);
  }
  feat[F_BIAS] = 1;
  let best = 0, bestScore = -Infinity;
  const cur = action[i];
  for (let a = 0; a < A; a++) {
    let sc = a === cur ? STICKY : 0;
    for (let f = 0; f < F; f++) sc += feat[f] * M[m + f * A + a];
    if (sc > bestScore) { bestScore = sc; best = a; }
  }
  action[i] = best;
}

// ───────────────────────── simulation tick ─────────────────────────
let tick = 0;
const NB = [-1, 1, -W, W];

function pickNext(i, c) {
  const a = action[i], start = (rnd() * 4) | 0;
  if (a < K) {
    const d = dist[a], here = d[c];
    if (here === 0) { using[i] = 1; return; }
    if (here !== INF) {
      for (let k = 0; k < 4; k++) {
        const nc = c + NB[(start + k) & 3];
        if (d[nc] < here) { tc[i] = nc; return; }
      }
    }
  }
  for (let k = 0; k < 4; k++) { // wander, or target unreachable
    const nc = c + NB[(start + k) & 3];
    if (nc >= 0 && nc < CELLS && tiles[nc] !== WALL) { tc[i] = nc; return; }
  }
}

function stepDecide() {
  const phase = tick % DECIDE_EVERY;
  for (let i = phase; i < N; i += DECIDE_EVERY) if (!using[i]) decide(i);
}

function stepMoveGrid() {
  users.fill(0);
  for (let i = 0; i < N; i++) {
    const n = i * K;
    for (let k = 0; k < K; k++) { const v = needs[n + k] + rate[n + k]; needs[n + k] = v > 1 ? 1 : v; }

    if (using[i]) {
      const a = action[i];
      if (dist[a][tc[i]] !== 0) { using[i] = 0; decide(i); continue; } // building was removed
      users[a]++;
      const v = needs[n + a] - RECOVER[a] - rate[n + a];
      if (v <= 0) { needs[n + a] = 0; using[i] = 0; decide(i); pickNext(i, tc[i]); }
      else needs[n + a] = v;
      continue;
    }

    const c = tc[i], sp = agentSpeed[i];
    const dx = (c % W) + 0.5 - px[i], dy = ((c / W) | 0) + 0.5 - py[i];
    const d = Math.abs(dx) + Math.abs(dy);
    if (d <= sp) { px[i] += dx; py[i] += dy; pickNext(i, c); }
    else { px[i] += dx / d * sp; py[i] += dy / d * sp; }
  }
}

// ───────────────────────── free movement ─────────────────────────
// Same distance fields, but agents are no longer tied to cell centres:
//   1. steer downhill on the field (direction blended from the four neighbouring cells),
//   2. get pushed apart by nearby agents (found through a per-cell bucket list, rebuilt every tick),
//   3. slide along walls instead of entering them.
let freeMove = true;
const vx = new Float32Array(N_MAX), vy = new Float32Array(N_MAX);   // current velocity, cells per tick
const settle = new Uint8Array(N_MAX);                                // ticks left to walk further into a building
const cellStart = new Int32Array(CELLS + 1), cellFill = new Int32Array(CELLS), cellItems = new Int32Array(N_MAX);
const SEP_R = 0.7, SEP_R2 = SEP_R * SEP_R;     // personal space, in cells
const SEP_PUSH = 1.2;                          // how hard neighbours push, relative to walking speed
const TURN = 0.25;                             // 1 = instant turns, lower = smoother curves
const MAX_NEIGHBOURS = 24;                     // cap per agent so a dense crowd cannot blow up the cost

function stepMoveFree() {
  users.fill(0);
  cellStart.fill(0);
  for (let i = 0; i < N; i++) { const c = (py[i] | 0) * W + (px[i] | 0); tc[i] = c; cellStart[c + 1]++; }
  for (let c = 0; c < CELLS; c++) { cellStart[c + 1] += cellStart[c]; cellFill[c] = cellStart[c]; }
  for (let i = 0; i < N; i++) cellItems[cellFill[tc[i]]++] = i;

  for (let i = 0; i < N; i++) {
    const n = i * K;
    for (let k = 0; k < K; k++) { const v = needs[n + k] + rate[n + k]; needs[n + k] = v > 1 ? 1 : v; }
    const c = tc[i], a = action[i];

    if (using[i]) {
      if (dist[a][c] !== 0) { using[i] = 0; decide(i); continue; }   // building was removed
      users[a]++;
      const v = needs[n + a] - RECOVER[a] - rate[n + a];
      if (v <= 0) { needs[n + a] = 0; using[i] = 0; decide(i); }
      else needs[n + a] = v;
      continue;
    }

    const sp = agentSpeed[i], x = px[i], y = py[i], inWall = tiles[c] === WALL;
    let dx = 0, dy = 0, arrived = false;
    if (a < K && !inWall) {
      const d = dist[a], here = d[c];
      if (here === 0) arrived = true;
      else if (here !== INF) {                     // downhill direction; walls count as uphill
        const up = here + 2, l = d[c - 1], r = d[c + 1], u = d[c - W], dn = d[c + W];
        dx = (l === INF ? up : l) - (r === INF ? up : r);
        dy = (u === INF ? up : u) - (dn === INF ? up : dn);
      }
    }
    if (arrived) {                                 // on the building: walk in a little further, then stop and use it
      if (settle[i] === 0) settle[i] = 1 + ((rnd() * 14) | 0);
      if (--settle[i] === 0) { using[i] = 1; vx[i] = vy[i] = 0; continue; }
      dx = vx[i]; dy = vy[i];
    } else settle[i] = 0;
    if (dx === 0 && dy === 0) {                    // wandering, or nowhere to go: keep heading, sometimes turn
      dx = vx[i]; dy = vy[i];
      if ((dx === 0 && dy === 0) || rnd() < 0.02) { const ang = rnd() * 6.2832; dx = Math.cos(ang); dy = Math.sin(ang); }
    }
    const len = Math.sqrt(dx * dx + dy * dy);
    dx = dx / len * sp; dy = dy / len * sp;

    let sx = 0, sy = 0, seen = 0;                  // separation from neighbours in the 3×3 cells around
    if (!inWall) for (let row = -W; row <= W && seen < MAX_NEIGHBOURS; row += W) for (let o = -1; o <= 1; o++) {
      const cc = c + row + o;
      for (let q = cellStart[cc], e = cellStart[cc + 1]; q < e && seen < MAX_NEIGHBOURS; q++) {
        const j = cellItems[q];
        if (j === i) continue;
        const ex = x - px[j], ey = y - py[j], d2 = ex * ex + ey * ey;
        if (d2 >= SEP_R2) continue;
        seen++;
        if (d2 > 1e-6) {
          const dd = Math.sqrt(d2), w = (1 - dd / SEP_R) / dd * (using[j] ? 0.35 : 1);   // seated agents push less
          sx += ex * w; sy += ey * w;
        } else sx += i > j ? 0.3 : -0.3;           // exactly on top of each other: split deterministically
      }
    }

    let nvx = vx[i] + (dx + sx * sp * SEP_PUSH - vx[i]) * TURN, nvy = vy[i] + (dy + sy * sp * SEP_PUSH - vy[i]) * TURN;
    const sl = nvx * nvx + nvy * nvy, top = sp * 1.3;
    if (sl > top * top) { const f = top / Math.sqrt(sl); nvx *= f; nvy *= f; }

    let nx = Math.min(W - 1.01, Math.max(1, x + nvx)), ny = y;       // move one axis at a time = slide along walls
    if (!inWall) {
      const home = tileOf(a);                      // while settling, do not walk back off the building
      let t = tiles[(y | 0) * W + (nx | 0)];
      if (t === WALL || (arrived && t !== home)) { nx = x; nvx = 0; }
      ny = Math.min(H - 1.01, Math.max(1, y + nvy));
      t = tiles[(ny | 0) * W + (nx | 0)];

  const p = canvasXY(e), dx = p[0] - prev[0], dy = p[1] - prev[1];
  pointers.set(e.pointerId, p);
  if (pointers.size === 2 && view !== 'flat') {              // two fingers: pinch-zoom and pan together
    const [q, r] = [...pointers.values()], d = pinchDist();
    cam.x -= dx / cam.zoom / 2; cam.y -= dy / cam.zoom / 2;
    zoomAt((q[0] + r[0]) / 2, (q[1] + r[1]) / 2, d / pinch); pinch = d;
  } else if (pointers.size === 1) {
    if (tool !== PAN) paint(p[0], p[1]);
    else if (view !== 'flat') { cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; clampCam(); }
  }
});
const drop = e => { pointers.delete(e.pointerId); };
onStage('pointerup', drop);
onStage('pointercancel', drop);
onStage('wheel', e => {
  if (view === 'flat') return;
  e.preventDefault();
  const p = canvasXY(e); zoomAt(p[0], p[1], e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// ───────────────────────── stats ─────────────────────────
const perf = { decide: 0, move: 0, matrix: 0, fields: 0, render: 0, frame: 16.7 };
const ema = (k, v) => { perf[k] += (v - perf[k]) * 0.05; };
const perfEl = document.getElementById('perf'), popEl = document.getElementById('pop'), matEl = document.getElementById('mat');

let showType = 0;
group(document.getElementById('typeBtns'), TYPES.map((t, k) => [t.name, k]), k => k === showType, k => { showType = k; updatePanels(); });
const typesEl = document.getElementById('types');
const describe = ty => [...Object.entries(ty.grow).map(([n, v]) => `${n} builds ×${v}`),
                        ...Object.entries(ty.weight).map(([n, v]) => `cares ×${v} about ${n}`)].join(', ') || 'baseline';

function updatePanels() {
  const sim = perf.decide + perf.move + perf.matrix;
  perfEl.innerHTML =
    `<tr><td>decide (matrix × state)</td><td>${perf.decide.toFixed(3)}</td></tr>` +
    `<tr><td>move + needs</td><td>${perf.move.toFixed(3)}</td></tr>` +
    `<tr><td>rebuild matrices</td><td>${perf.matrix.toFixed(4)}</td></tr>` +
    `<tr><td>render</td><td>${perf.render.toFixed(3)}</td></tr>` +
    `<tr><td>flow fields (last edit)</td><td>${perf.fields.toFixed(3)}</td></tr>` +
    `<tr><td>sim total / 16.7 budget</td><td>${(sim / 16.7 * 100).toFixed(1)}%</td></tr>` +
    `<tr><td>fps</td><td>${(1000 / perf.frame).toFixed(0)}</td></tr>`;

  const cnt = new Int32Array(A), avg = new Float32Array(K), perType = new Int32Array(T);
  for (let i = 0; i < N; i++) {
    cnt[action[i]]++; perType[type[i]]++;
    for (let k = 0; k < K; k++) avg[k] += needs[i * K + k];
  }
  let h = '<thead><tr><th>action</th><th>agents</th><th>using</th><th>crowding</th><th>need</th><th>avg</th></tr></thead>';
  for (let a = 0; a < A; a++) {
    h += `<tr><td><span class="sw" style="background:var(${ACTION_VARS[a]})"></span>${ACTION_NAMES[a]}</td><td>${cnt[a]}</td>` +
      (a < K ? `<td>${users[a]}</td><td>${(saturation[a] * 100).toFixed(0)}%</td><td>${NEEDS[a].name}</td><td>${(avg[a] / N).toFixed(2)}</td>`
             : '<td></td><td></td><td></td><td></td>') + '</tr>';
  }
  popEl.innerHTML = h;

  let ty = '<thead><tr><th>type</th><th>agents</th><th>speed</th><th style="text-align:left">differences</th></tr></thead>';
  TYPES.forEach((t, k) => {
    ty += `<tr><td>${t.name}</td><td>${perType[k]}</td><td>×${t.speed}</td><td style="text-align:left;white-space:normal">${describe(t)}</td></tr>`;
  });
  typesEl.innerHTML = ty;

  let m = '<thead><tr><th></th>' + ACTION_NAMES.map(n => `<th>${n}</th>`).join('') + '</tr></thead>';
  for (let f = 0; f < F; f++) {
    m += `<tr><td>${FEATURE_NAMES[f]}</td>`;
    for (let a = 0; a < A; a++) { const v = M[showType * MA + f * A + a]; m += `<td>${v === 0 ? '·' : v.toFixed(2)}</td>`; }
    m += '</tr>';
  }
  matEl.innerHTML = m;
}

// ───────────────────────── main loop ─────────────────────────
let last = performance.now(), frames = 0;
function frame(now) {
  ema('frame', now - last); last = now;

  if (dirty) {
    const t = performance.now();
    buildFields(); drawTiles(); dirty = false;
    perf.fields = performance.now() - t;
  }

  let tD = 0, tM = 0, tX = 0;
  for (let s = 0; s < speed; s++) {
    let t0 = performance.now();
    if (tick % MATRIX_EVERY === 0) rebuildMatrix();
    let t1 = performance.now();
    stepDecide();
    let t2 = performance.now();
    stepMove();
    let t3 = performance.now();
    tX += t1 - t0; tD += t2 - t1; tM += t3 - t2;
    tick++;
  }
  if (speed > 0) { ema('matrix', tX); ema('decide', tD); ema('move', tM); }

  const r0 = performance.now();
  render();
  ema('render', performance.now() - r0);

  if (frames++ % 15 === 0) updatePanels();
  requestAnimationFrame(frame);
}

// Headless benchmark, callable from the console: bench(1000, 2000) → ms per tick
window.bench = (n, ticks) => {
  for (let i = N; i < n; i++) spawn(i);
  N = n; nSlider.value = n; nLabel.textContent = n;
  const out = { agents: n, ticks, decide: 0, move: 0, matrix: 0 };
  for (let s = 0; s < ticks; s++) {
    const t0 = performance.now();
    if (tick % MATRIX_EVERY === 0) rebuildMatrix();
    const t1 = performance.now(); stepDecide();
    const t2 = performance.now(); stepMove();
    const t3 = performance.now();
    out.matrix += t1 - t0; out.decide += t2 - t1; out.move += t3 - t2; tick++;
  }
  const saved = [cam.x, cam.y, cam.zoom];
  const time = fn => { const t = performance.now(); for (let k = 0; k < 20; k++) fn(); return (performance.now() - t) / 20; };
  const glFrame = () => { renderGL(); glr.gl.finish(); };          // finish() waits for the GPU, so its time is counted
  cam.x = ISO_W / 2; cam.y = ISO_H / 2; cam.zoom = FIT_ZOOM;      // whole map on screen = worst case
  out.renderFlat = time(renderFlat);
  out.renderIso2d = time(renderIso);
  if (glr) { out.renderGL = time(glFrame); cam.zoom = 2; out.renderGLZoom = time(glFrame); }
  out.render = glr ? out.renderGL : out.renderIso2d;
  [cam.x, cam.y, cam.zoom] = saved;
  out.decide /= ticks; out.move /= ticks; out.matrix /= ticks;
  out.simTotal = out.decide + out.move + out.matrix;
  const mode = freeMove;
  const timeMode = free => {
    setMove(free);
    const t = performance.now();
    for (let s = 0; s < ticks; s++) { if (tick % MATRIX_EVERY === 0) rebuildMatrix(); stepDecide(); stepMove(); tick++; }
    return (performance.now() - t) / ticks;
  };
  out.simGrid = timeMode(false); out.simFree = timeMode(true);
  setMove(mode);
  return out;
};

// On-page benchmark so it can be run on a phone, where there is no console.
const benchBtn = document.getElementById('benchBtn'), benchOut = document.getElementById('benchOut');
benchBtn.onclick = async () => {
  const runs = [[1000, 1000], [5000, 400], [20000, 150]];
  const startN = N, wait = ms => new Promise(r => setTimeout(r, ms));
  const f = (v, d) => v === undefined ? '–' : v.toFixed(d);
  let rows = '<thead><tr><th>agents</th><th>sim grid</th><th>sim free</th><th>top-down</th><th>iso 2D</th><th>WebGL</th><th>WebGL 2×</th><th>sim + draw, % of 16.7</th><th>live fps</th></tr></thead>';
  benchBtn.disabled = true; benchBtn.textContent = 'running…';
  for (const [n, ticks] of runs) {
    await wait(50);                               // let the page repaint between runs
    const o = bench(n, ticks);
    const f0 = frames, t0 = performance.now();    // then let it run for real and count frames
    await wait(1500);
    const fps = (frames - f0) / (performance.now() - t0) * 1000;
    rows += `<tr><td>${o.agents}</td><td>${f(o.simGrid, 3)}</td><td>${f(o.simFree, 3)}</td><td>${f(o.renderFlat, 2)}</td><td>${f(o.renderIso2d, 2)}</td>` +
      `<td>${f(o.renderGL, 2)}</td><td>${f(o.renderGLZoom, 2)}</td><td>${((o.simTotal + o.render) / 16.7 * 100).toFixed(1)}%</td><td>${fps.toFixed(0)}</td></tr>`;
    benchOut.innerHTML = rows;
  }
  N = startN; nSlider.value = startN; nLabel.textContent = startN;
  benchBtn.disabled = false; benchBtn.textContent = 'run benchmark';
};

const retheme = () => { loadPalette(); buildSprites(); drawTiles(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

buildMap(); buildFields(); buildSprites(); drawTiles(); setView('iso'); setMove(true);
for (let i = 0; i < N; i++) spawn(i);
rebuildMatrix();
requestAnimationFrame(frame);
</script>
